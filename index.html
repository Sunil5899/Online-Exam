<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Exam</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Online Exam</h1>

    <!-- LOGIN / REGISTER -->
    <div id="authBox">

        <div class="tabs">
            <button onclick="showLogin()">Login</button>
            <button onclick="showRegister()">Register</button>
        </div>

        <div id="loginBox">
            <h2>Student Login</h2>

            <input type="text" id="loginUsername" placeholder="Username">
            <input type="password" id="loginPassword" placeholder="Password">

            <button onclick="login()">Login</button>

            <p id="loginMessage"></p>
        </div>

        <div id="registerBox" style="display:none;">
            <h2>Student Registration</h2>

            <input type="text" id="regName" placeholder="Full Name">
            <input type="text" id="regUsername" placeholder="Username">
            <input type="password" id="regPassword" placeholder="Password">

            <button onclick="register()">Create Account</button>

            <p id="registerMessage"></p>
        </div>

    </div>


    <!-- SUBJECT SELECTION -->
    <div id="subjectBox" style="display:none;">

        <h2 id="welcomeName"></h2>

        <p>Select Subject</p>

        <div class="subjects">

            <button onclick="startExam('Computer')">
                Computer
            </button>

            <button onclick="startExam('Mathematics')">
                Mathematics
            </button>

            <button onclick="startExam('Hindi')">
                Hindi
            </button>

            <button onclick="startExam('English')">
                English
            </button>

            <button onclick="startExam('Reasoning')">
                Reasoning
            </button>

            <button onclick="startExam('General Knowledge')">
                General Knowledge
            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>
<!-- EXAM BOX -->
<div id="examBox" style="display:none;">

    <div class="exam-header">
        <h2 id="examSubject"></h2>
        <div id="timer">20:00</div>
    </div>

    <div id="questionNumber"></div>

    <h3 id="questionText"></h3>

    <div id="options"></div>

    <div class="exam-buttons">
        <button onclick="previousQuestion()">Previous</button>
        <button onclick="nextQuestion()">Next</button>
        <button onclick="submitExam()">Submit Exam</button>
    </div>

</div>
    
</body>
</html>
